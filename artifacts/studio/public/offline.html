<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Offline — Advanced Creation Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --fg: #f7f7f4;
        --muted: #9a9a96;
        --accent: #e5ff00;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        text-align: left;
      }
      .mark {
        width: 2.5rem;
        height: 2.5rem;
        margin-bottom: 1.5rem;
      }
      .label {
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 0.75rem;
      }
      h1 {
        font-family: Syne, system-ui, sans-serif;
        font-size: clamp(2rem, 6vw, 2.75rem);
        line-height: 0.95;
        margin: 0 0 1rem;
        letter-spacing: -0.03em;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 1.75rem;
      }
      button {
        appearance: none;
        border: 0;
        background: var(--fg);
        color: var(--bg);
        padding: 0.85rem 1.25rem;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" fill="#050505" />
        <rect x="7" y="6" width="5" height="20" fill="#E5FF00" />
        <rect x="20" y="6" width="5" height="20" fill="#E5FF00" />
        <rect x="7" y="24" width="18" height="3" fill="#E5FF00" />
        <polygon points="13,24 23,8 25,8 15,24" fill="#F7F7F4" />
      </svg>
      <p class="label">Advanced Creation Studio</p>
      <h1>You’re offline.</h1>
      <p>
        The page you need isn’t available without a connection. Reconnect and
        try again — your briefing request and partner resources will be waiting.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
