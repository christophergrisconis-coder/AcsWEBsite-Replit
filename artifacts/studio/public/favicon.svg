<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Advanced Creation Studio">
  <!-- Tab favicon: doorway + electric path — readable at 16px -->
  <rect width="32" height="32" fill="#050505"/>
  <!-- Left pillar -->
  <rect x="7" y="6" width="5" height="20" fill="#E5FF00"/>
  <!-- Right pillar -->
  <rect x="20" y="6" width="5" height="20" fill="#E5FF00"/>
  <!-- Threshold -->
  <rect x="7" y="24" width="18" height="3" fill="#E5FF00"/>
  <!-- Electric diagonal path through the doorway -->
  <polygon points="13,24 23,8 25,8 15,24" fill="#F7F7F4"/>
</svg>
