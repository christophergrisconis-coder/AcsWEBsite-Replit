name: Fetch ACS PNG icons
on:
  push:
    paths:
      - "artifacts/studio/public/acs-icon-urls.json"
      - ".github/workflows/fetch-acs-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PNG icons from staging URLs
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, pathlib, urllib.request, hashlib
          urls = json.loads(pathlib.Path("artifacts/studio/public/acs-icon-urls.json").read_text())
          out_dir = pathlib.Path("artifacts/studio/public")
          for name, url in urls.items():
              print(f"Fetching {name} from {url}")
              data = urllib.request.urlopen(url, timeout=120).read()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{name} is not a PNG")
              (out_dir / name).write_bytes(data)
              print(f"  wrote {len(data)} bytes sha256={hashlib.sha256(data).hexdigest()}")
          PY
      - name: Commit PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/studio/public/*.png
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add ACS favicon, PWA icons, and web app manifest"
          git push
